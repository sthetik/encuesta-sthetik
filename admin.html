<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de satisfacción · Sthetik</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/logo-sthetik.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .wrap { max-width: 1120px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 64px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 36px; }
    .top img { width: 120px; }
    .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    select, .tbtn {
      font: inherit; font-size: 15px; color: var(--ink);
      background: var(--paper); border: 1.5px solid var(--petal);
      border-radius: var(--radius-pill); padding: 9px 16px;
    }
    .tbtn.primary { background: var(--rose-deep); border-color: var(--rose-deep); color: #fff; }

    .hero {
      display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px;
      background: var(--paper); border-radius: 28px; padding: clamp(24px, 4vw, 44px); margin-bottom: 24px;
    }
    .score { font-family: var(--serif); font-size: clamp(72px, 12vw, 132px); line-height: .9; font-weight: 400; color: var(--rose-deep); margin: 0; }
    .score small { font-family: var(--sans); font-size: 22px; color: var(--rose); margin-left: 8px; }
    .hero h1 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0 0 18px; }
    .hero .sub { font-size: 16px; margin-top: 14px; color: var(--rose-deep); }
    .kpis { display: grid; gap: 18px; align-content: center; }
    .kpi { border-left: 3px solid var(--petal); padding-left: 16px; }
    .kpi b { font-family: var(--serif); font-weight: 600; font-size: 34px; display: block; }
    .kpi span { font-size: 15px; color: var(--rose-deep); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .q { background: var(--paper); border-radius: var(--radius-box); padding: 22px; }
    .q h2 { font-family: var(--serif); font-weight: 400; font-size: 18px; line-height: 1.35; margin: 0 0 6px; }
    .q .avg { font-size: 14px; color: var(--rose-deep); margin: 0 0 16px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; margin-bottom: 12px; font-size: 15px; }
    .track { grid-column: 1 / -1; height: 8px; background: var(--blush); border-radius: 8px; overflow: hidden; }
    .fill { height: 100%; background: var(--rose); border-radius: 8px; transition: width .6s ease; }
    .row .n { color: var(--rose-deep); font-variant-numeric: tabular-nums; }

    .panel { background: var(--paper); border-radius: var(--radius-box); padding: 22px; margin-bottom: 24px; }
    .panel h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0 0 16px; }
    .chart-box { position: relative; height: 260px; }

    .comments { display: grid; gap: 12px; max-height: 520px; overflow-y: auto; }
    .c { border-bottom: 1px solid var(--petal); padding: 4px 0 14px; }
    .c p { margin: 0 0 6px; font-size: 17px; line-height: 1.55; max-width: 72ch; }
    .c .meta { font-size: 13px; color: var(--rose-deep); }
    .empty { color: var(--rose-deep); font-size: 16px; }

    @media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <img src="assets/logo-sthetik.png" alt="Sthetik Skin & Beauty" />
      <div class="tools">
        <label for="range" class="sr" style="position:absolute;left:-9999px">Periodo</label>
        <select id="range">
          <option value="7">Últimos 7 días</option>
          <option value="30" selected>Últimos 30 días</option>
          <option value="90">Últimos 90 días</option>
          <option value="0">Todo</option>
        </select>
        <button class="tbtn" id="refresh">Actualizar</button>
        <button class="tbtn primary" id="csv">Descargar CSV</button>
      </div>
    </div>

    <section class="hero">
      <div>
        <h1>Calificación general</h1>
        <p class="score"><span id="score">–</span><small>de 5</small></p>
        <p class="sub" id="total">Cargando respuestas…</p>
      </div>
      <div class="kpis">
        <div class="kpi"><b id="kRec">–</b><span>recomendaría Sthetik</span></div>
        <div class="kpi"><b id="kVol">–</b><span>volvería sin dudarlo</span></div>
        <div class="kpi"><b id="kAt">–</b><span>califica la atención como excelente</span></div>
      </div>
    </section>

    <section class="grid" id="questions"></section>

    <section class="panel">
      <h2>Evolución semanal</h2>
      <div class="chart-box"><canvas id="trend" aria-label="Respuestas y calificación promedio por semana"></canvas></div>
    </section>

    <section class="panel">
      <h2>Comentarios y sugerencias</h2>
      <div class="comments" id="comments"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script>
    const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.STHETIK_CONFIG;
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const Q = window.STHETIK_QUESTIONS.filter(q => q.type !== "text");
    const $ = id => document.getElementById(id);
    const pct = (a, b) => b ? Math.round((a / b) * 100) + "%" : "–";
    const fmt = n => n.toLocaleString("es-EC", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const scoreOf = (q, v) => (q.options.find(o => o.label === v) || {}).score;
    let rows = [], chart;

    async function load() {
      $("total").textContent = "Cargando respuestas…";
      const days = +$("range").value;
      let query = db.from("respuestas").select("*").order("created_at", { ascending: false }).limit(5000);
      if (days) query = query.gte("created_at", new Date(Date.now() - days * 864e5).toISOString());
      const { data, error } = await query;
      if (error) { $("total").textContent = "No se pudieron cargar los datos. Revisa config.js y las políticas de Supabase."; console.error(error); return; }
      rows = data;
      draw();
    }

    function rowScore(r) {
      const s = Q.map(q => scoreOf(q, r[q.key])).filter(Boolean);
      return s.reduce((a, b) => a + b, 0) / s.length;
    }

    function draw() {
      const n = rows.length;
      $("total").textContent = n ? `${n} ${n === 1 ? "respuesta" : "respuestas"} en el periodo` : "Aún no hay respuestas en este periodo. Comparte el formulario para empezar a recibirlas.";
      $("score").textContent = n ? fmt(rows.reduce((a, r) => a + rowScore(r), 0) / n) : "–";
      $("kRec").textContent = pct(rows.filter(r => r.recomendaria === "Sí").length, n);
      $("kVol").textContent = pct(rows.filter(r => r.volveria === "Sí, sin dudarlo").length, n);
      $("kAt").textContent = pct(rows.filter(r => r.atencion === "Excelente").length, n);

      $("questions").innerHTML = Q.map(q => {
        const avg = n ? rows.reduce((a, r) => a + (scoreOf(q, r[q.key]) || 0), 0) / n : 0;
        return `<article class="q">
          <h2>${q.title}</h2>
          <p class="avg">${n ? "Promedio " + fmt(avg) + " de 5" : "Sin datos"}</p>
          ${q.options.map(o => {
            const c = rows.filter(r => r[q.key] === o.label).length;
            const w = n ? (c / n) * 100 : 0;
            return `<div class="row"><span>${o.label}</span><span class="n">${c} · ${pct(c, n)}</span>
              <div class="track"><div class="fill" style="width:${w}%"></div></div></div>`;
          }).join("")}
        </article>`;
      }).join("");

      const withText = rows.filter(r => r.comentario);
      $("comments").innerHTML = withText.length
        ? withText.map(r => `<div class="c"><p>${escapeHtml(r.comentario)}</p>
            <span class="meta">${new Date(r.created_at).toLocaleDateString("es-EC", { day: "numeric", month: "short", year: "numeric" })}
            · Atención: ${r.atencion} · Resultados: ${r.resultados}</span></div>`).join("")
        : '<p class="empty">No hay comentarios en este periodo.</p>';

      drawTrend();
    }

    function weekStart(d) {
      const x = new Date(d); x.setHours(0, 0, 0, 0);
      x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
      return x.toISOString().slice(0, 10);
    }

    function drawTrend() {
      const byWeek = {};
      rows.forEach(r => { const k = weekStart(r.created_at); (byWeek[k] ||= []).push(rowScore(r)); });
      const keys = Object.keys(byWeek).sort();
      const labels = keys.map(k => new Date(k + "T00:00").toLocaleDateString("es-EC", { day: "numeric", month: "short" }));
      const counts = keys.map(k => byWeek[k].length);
      const avgs = keys.map(k => +(byWeek[k].reduce((a, b) => a + b, 0) / byWeek[k].length).toFixed(2));
      if (chart) chart.destroy();
      chart = new Chart($("trend"), {
        data: {
          labels,
          datasets: [
            { type: "bar", label: "Respuestas", data: counts, backgroundColor: "#EFDAD6", borderRadius: 6, yAxisID: "y" },
            { type: "line", label: "Calificación promedio", data: avgs, borderColor: "#8E5A5E", backgroundColor: "#8E5A5E", tension: .3, yAxisID: "y1" }
          ]
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { labels: { font: { family: "Jost" }, color: "#4A2E30" } } },
          scales: {
            x: { grid: { display: false }, ticks: { color: "#8E5A5E" } },
            y: { beginAtZero: true, ticks: { precision: 0, color: "#8E5A5E" }, grid: { color: "#F7EDEA" } },
            y1: { position: "right", min: 1, max: 5, grid: { display: false }, ticks: { color: "#8E5A5E" } }
          }
        }
      });
    }

    function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    function exportCsv() {
      const cols = ["created_at", ...window.STHETIK_QUESTIONS.map(q => q.key)];
      const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csv = [cols.join(","), ...rows.map(r => cols.map(c => esc(r[c])).join(","))].join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
      a.download = `sthetik-respuestas-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    $("range").addEventListener("change", load);
    $("refresh").addEventListener("click", load);
    $("csv").addEventListener("click", exportCsv);
    load();
  </script>
</body>
</html>
